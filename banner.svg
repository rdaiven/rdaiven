    <circle cx="700" cy="40" r="2"/><circle cx="740" cy="40" r="2"/><circle cx="780" cy="40" r="2"/><circle cx="820" cy="40" r="2"/><circle cx="860" cy="40" r="2"/>
    <circle cx="700" cy="80" r="2"/><circle cx="740" cy="80" r="2"/><circle cx="780" cy="80" r="2"/><circle cx="820" cy="80" r="2"/><circle cx="860" cy="80" r="2"/>
    <circle cx="700" cy="120" r="2"/><circle cx="740" cy="120" r="2"/><circle cx="780" cy="120" r="2"/><circle cx="820" cy="120" r="2"/><circle cx="860" cy="120" r="2"/>
    <circle cx="700" cy="160" r="2"/><circle cx="740" cy="160" r="2"/><circle cx="780" cy="160" r="2"/><circle cx="820" cy="160" r="2"/><circle cx="860" cy="160" r="2"/>
